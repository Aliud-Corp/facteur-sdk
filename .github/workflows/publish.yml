# Publishing, from the public repository and nowhere else.
#
# The provenance npm attaches to a package names the repository the publication ran from,
# and that name is shown on the package page. Publishing from the source repository would
# put its address in front of every visitor, which is the reason this workflow lives here
# rather than there.
#
# Manual on purpose. A publication is irreversible — npm keeps a version forever, and
# unpublishing is bounded to 72 hours — so it is an act somebody performs, never a
# consequence of a merge.

name: publish

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which package to publish
        required: true
        type: choice
        options:
          - '@facteur-eu/sdk'
          - playwright-facteur
          - cypress-facteur
          - create-facteur

permissions:
  # `id-token: write` is what mints the OIDC token npm trades for provenance. Naming any
  # permission sets every other one to none, so `contents: read` is written rather than
  # inherited.
  contents: read
  id-token: write

jobs:
  publish:
    name: ${{ inputs.package }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # Never cache in a release build: what gets published has to come from this
          # checkout and from nothing else.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later, and Node 22 ships 10.9. Without it
      # npm does not know how to trade the OIDC token, sends an unauthenticated request,
      # and the registry answers `404 Not Found` on the PUT — which reads as "the package
      # does not exist" and means "you are nobody". That cost one failed run.
      - name: npm new enough to trade an OIDC token
        run: |
          npm install -g npm@latest
          npm --version

      - name: Locate the package
        id: locate
        run: |
          case "${{ inputs.package }}" in
            '@facteur-eu/sdk')       dir=packages/sdk ;;
            playwright-facteur)   dir=packages/playwright-facteur ;;
            cypress-facteur)      dir=packages/cypress-facteur ;;
            create-facteur)       dir=packages/create-facteur ;;
            *) echo "unknown package"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      # The tarball is what ships. Listing it before publishing is the last chance to see
      # a file that should not leave, and it costs a second.
      - name: What the tarball carries
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm pack --dry-run

      - name: Publish
        working-directory: ${{ steps.locate.outputs.dir }}
        run: npm publish --provenance --access public
